name: ci & deploy

# A push that only changes docs runs nothing
on:
  push:
    paths-ignore:
      - docs/**
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a superseded run on branches, but never a main run, which may be deploying
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # cloudflare-access, version 1: the same job is in every project deployed to Cloudflare, only the
  # env block changes. It runs alongside ci and build, so a wrong account or token turns the run red
  # in seconds, and the deploy job waits for it.
  cloudflare-access:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: nuxt-template
      # Empty when the Worker has no custom domain to check
      WORKER_HOSTNAME: ""

    steps:
      - name: Check the account and the token permissions
        run: |
          api() {
            curl --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4$1"
          }
          succeeded() { jq -e '.success == true' > /dev/null; }
          fail() { echo "::error::$1"; exit 1; }

          # Only Account API tokens verify on this endpoint: a User API token is rejected on purpose.
          # It does not prove the token belongs to this account, the next check does
          token_check=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          [ "$(jq -r '.result.status // empty' <<< "$token_check")" = "active" ] \
            || fail "CLOUDFLARE_API_TOKEN is not an active Account API token (User API tokens are not accepted): $(jq -c '.errors' <<< "$token_check")"

          scripts=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")
          succeeded <<< "$scripts" \
            || fail "The token cannot list the Workers of the account in CLOUDFLARE_ACCOUNT_ID: it belongs to another account, or lacks Workers Editor. API errors: $(jq -c '.errors' <<< "$scripts")"

          # With the domain already attached, Workers Editor is enough to deploy: only adding or
          # changing a route also needs Workers Routes Write on the zone
          if [ -n "$WORKER_HOSTNAME" ]; then
            domains=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?service=$WORKER_NAME&hostname=$WORKER_HOSTNAME")
            jq -e '.success == true and (.result | length) > 0' > /dev/null <<< "$domains" \
              || fail "$WORKER_HOSTNAME is not attached to the $WORKER_NAME Worker: attach it in the dashboard, or give the token Zone > Workers Routes > Write. API errors: $(jq -c '.errors' <<< "$domains")"
          fi

          echo "The token reaches the account${WORKER_HOSTNAME:+ and $WORKER_HOSTNAME is attached to $WORKER_NAME}"

  ci:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Read the Node version
        run: echo "NODE_VERSION=$(jq -r .volta.node package.json)" >> "$GITHUB_ENV"

      # setup-node finds this copy in the tool cache and skips the download from actions/node-versions,
      # which takes about 10 s and often answers 504 three times before falling back to nodejs.org
      - name: Cache node
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/node/${{ env.NODE_VERSION }}
          key: node-${{ env.NODE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install node
        uses: actions/setup-node@v7
        with:
          # Reads volta.node, so CI runs the exact version pinned for local work
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check translation keys
        run: pnpm run check:i18n

      - name: Check dead code
        run: pnpm run fallow:dead-code

      # The content strategy of the lint script ignores file times, which a fresh checkout resets
      - name: Cache the ESLint results
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  # Runs alongside ci instead of after it, and hands the site to the deploy job
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Read the Node version
        run: echo "NODE_VERSION=$(jq -r .volta.node package.json)" >> "$GITHUB_ENV"

      # setup-node finds this copy in the tool cache and skips the download from actions/node-versions,
      # which takes about 10 s and often answers 504 three times before falling back to nodejs.org
      - name: Cache node
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/node/${{ env.NODE_VERSION }}
          key: node-${{ env.NODE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install node
        uses: actions/setup-node@v7
        with:
          # Reads volta.node, so CI runs the exact version pinned for local work
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the static site
        run: pnpm run generate

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: .output/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [ci, build, cloudflare-access]
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-26.04

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      npm_config_prefer_offline: true

    steps:
      # Nothing to build or install: the Worker config and the locked wrangler version. wrangler runs
      # on the runner's preinstalled Node, since it only uploads the site
      - name: Checkout the Worker config
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            wrangler.jsonc
            pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      # The wrangler version pnpm-lock.yaml resolves, run with npx instead of pnpm install
      - name: Find the wrangler version
        run: |
          version=$(grep -A2 '^      wrangler:$' pnpm-lock.yaml | sed -n 's/^ *version: \([0-9][0-9.]*\).*/\1/p')
          [ -n "$version" ] || { echo "::error::No wrangler version found in pnpm-lock.yaml"; exit 1; }
          echo "WRANGLER=wrangler@$version" >> "$GITHUB_ENV"

      # npx reads the package and its metadata from this cache instead of the registry
      - name: Cache wrangler
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npx-${{ env.WRANGLER }}-${{ runner.os }}

      - name: Download the site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: .output/public

      - name: Deploy to Cloudflare Workers
        run: npx --yes "$WRANGLER" deploy
